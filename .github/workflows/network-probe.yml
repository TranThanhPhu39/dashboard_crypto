name: Diagnose public data connectivity
on:
  workflow_dispatch:
    inputs:
      api_only:
        type: boolean
        default: false
        description: Test API reachability without sending an API key
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      API_ONLY: ${{ inputs.api_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Probe FRED and ALFRED without recording research receipts
        run: python tools/probe_worker_network.py
