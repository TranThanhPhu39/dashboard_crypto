name: Check public dashboard on pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Export public snapshot
        run: python tools/export_public_dashboard.py --dashboard-only
      - name: Validate public snapshot
        run: python tools/check_public_dashboard.py --dashboard-only
      - name: Verify dashboard boot, lazy replay and glossary
        run: |
          python -m unittest discover -s tests -p test_dashboard_experience.py
          node tests/validate_experience.cjs
          node tests/validate_studio.cjs
          node tests/validate_release_dashboard.cjs
