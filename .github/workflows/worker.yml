name: Scheduled crypto worker and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Run the worker, monitor, or test migration without taking ownership
        default: run
        options: [run, monitor, preflight]

permissions:
  contents: read

concurrency:
  group: topic09-live-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'TranThanhPhu39/dashboard_crypto' && github.ref == 'refs/heads/main' && (vars.TOPIC09_WORKER_ENABLED == 'true' || inputs.mode == 'preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    outputs:
      publish: ${{ steps.publish.outputs.ready }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOPIC09_WORKER_ENABLED: ${{ vars.TOPIC09_WORKER_ENABLED }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select operation
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          mode = os.environ.get('REQUESTED_MODE') or ('monitor' if os.environ.get('SCHEDULE') == '45 * * * *' else 'run')
          if mode not in ('run', 'monitor', 'preflight'):
              raise ValueError('Unknown operation')
          config = json.load(open('config/github_worker.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('value=' + mode + '\nbootstrap=' + config['bootstrap']['sha256'] + '\n')
          PY
      - name: Set up matching Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install frozen inference dependencies
        run: python -m pip install -r requirements-worker.txt
      - name: Test durability and operational guards
        run: |
          python -m unittest discover -s tests -p test_github_worker.py
          python -m unittest discover -s tests -p test_automation.py
      - name: Cache encrypted bootstrap only
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .worker-cache/bootstrap
          key: topic09-bootstrap-${{ steps.mode.outputs.bootstrap }}
      - name: Cache encrypted state objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .worker-cache/state
          key: topic09-state-${{ steps.mode.outputs.bootstrap }}-${{ github.run_id }}
          restore-keys: topic09-state-${{ steps.mode.outputs.bootstrap }}-
      - name: Restore committed encrypted runtime
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC09_STATE_KEY: ${{ secrets.TOPIC09_STATE_KEY }}
        run: python tools/run_github_worker.py restore
      - name: Execute selected operation
        id: operation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
        run: python tools/run_github_worker.py "$WORKER_MODE"
      - name: Verify interactive dashboard
        if: steps.operation.outcome == 'success'
        run: node tests/validate_release_dashboard.cjs
      - name: Persist receipts and ledger before publication
        id: persist
        if: always() && steps.restore.outcome == 'success' && steps.mode.outputs.value != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC09_STATE_KEY: ${{ secrets.TOPIC09_STATE_KEY }}
        run: python tools/run_github_worker.py persist
      - name: Export verified runtime dashboard
        if: steps.operation.outcome == 'success' && steps.persist.outcome == 'success' && steps.mode.outputs.value != 'preflight'
        run: |
          python tools/export_public_dashboard.py --dashboard-only --worker
          python tools/check_public_dashboard.py --dashboard-only
      - name: Upload dashboard-only Pages artifact
        id: artifact
        if: steps.operation.outcome == 'success' && steps.persist.outcome == 'success' && steps.mode.outputs.value != 'preflight'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-pages
      - name: Record publication readiness
        id: publish
        if: steps.artifact.outcome == 'success'
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Maintain operational heartbeat and original stop date
        if: steps.persist.outcome == 'success' && steps.mode.outputs.value != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/run_github_worker.py heartbeat
      - name: Preserve operation failure status
        if: always() && steps.operation.outcome == 'failure'
        run: |
          echo 'Worker operation failed. Available receipts were checkpointed when integrity checks allowed it.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    needs: worker
    if: needs.worker.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
